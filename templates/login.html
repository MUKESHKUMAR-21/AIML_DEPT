{% extends 'base.html' %}

{% block title %}AIML Department - Login{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="glass-panel animate-fade-in" style="width: 100%; max-width: 450px; padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 64px; height: 64px; background: rgba(0, 0, 0, 0.1); border: 1px solid var(--glass-border); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--text-primary); margin-bottom: 1rem;">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 style="font-size: 1.8rem; font-weight: 700;">Welcome Back</h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Sign in to continue to your dashboard</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" style="padding-left: 2.5rem;" required>
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="password" class="form-label">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-key" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" style="padding-left: 2.5rem;" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 0.85rem;">
                Sign In <i class="fa-solid fa-arrow-right" style="margin-left: 0.5rem;"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
